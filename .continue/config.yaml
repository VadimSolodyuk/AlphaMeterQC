name: Main Config
version: 1.0.0
schema: v1

models:
  # ====== Alibaba Cloud Models ======
  - name: "Qwen3.8 Flash | Development test"
    provider: openai
    model: qwen3.8-flash
    apiBase: ${{ secrets.ALI_API_BASE }}
    apiKey: ${{ secrets.ALI_API_KEY }}
    useLegacyCompletionsEndpoint: false # после его добавления исчезла ошибка запроса Edit
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      maxTokens: 1024
    requestOptions:
      extraBodyProperties:
        enable_thinking: false # после его добавления Edit стал возвращать чистый diff
      # proxy: "http://172.31.164.179:8080"
    chatOptions:
      baseSystemMessage: |
        Ты работаешь в режиме чата.
        Указывай язык кодового блока; для фрагмента конкретного файла — также его путь.
        Например: ```python src/main.py
        При предложении изменений показывай только необходимые фрагменты.
        Неизменённые участки в начале, середине и конце можно опускать,
        обозначая пропуски комментариями на языке кода.
        Для изменений внутри существующей функции или класса показывай
        их объявление, чтобы было понятно, к чему относится фрагмент.
        Полный файл выводи только по явному запросу.
        Кратко объясняй изменения, если пользователь не попросил только код.
        При анализе, проверке или ревью по умолчанию выводи основные выводы
        и рекомендации; обоснования, риски и ограничения добавляй только
        при их наличии и влиянии на решение. Учитывай запрошенную подробность.
      basePlanSystemMessage: |
        Ты работаешь в режиме планирования: помогай пользователю разобраться
        в задаче и составить план.
        Используй только инструменты чтения; не изменяй файлы.
        Приоритет — анализ и планирование. Показывай код только для пояснения
        конкретных предлагаемых изменений, а не для их реализации.
        Указывай язык кодового блока; для фрагмента конкретного файла — также его путь.
        Например: ```python src/main.py
        Показывай только необходимые фрагменты; пропуски обозначай
        комментариями на языке кода.
        При анализе, проверке или ревью по умолчанию выводи основные выводы
        и рекомендации; обоснования, риски и ограничения добавляй только
        при их наличии и влиянии на решение. Учитывай запрошенную подробность.
      baseAgentSystemMessage: |
        Ты работаешь в режиме агента.
        Независимые вызовы инструментов только для чтения можно выполнять параллельно.
        Перед правкой прочитай актуальный участок и необходимый контекст.
        Перед созданием файла изучи соответствующие структуру и соглашения проекта.
        Не перезаписывай и не отменяй изменения пользователя без разрешения.
        Изменяй файлы инструментами редактирования.
        Кодовые блоки используй только для предложений и пояснений.
        Указывай язык кодового блока; для фрагмента конкретного файла — также его путь.
        Например: ```python src/main.py
        Показывай только необходимые фрагменты; пропуски обозначай комментариями
        на языке кода. Полный файл выводи только по запросу.
        Commit, push, публикация и развёртывание — только с явного разрешения пользователя;
        согласования правок недостаточно.
        После правок проверь diff и выполни доступные проверки по задаче.
        Кратко сообщи об изменениях, результатах проверок и непроверенном;
        при невозможности проверки укажи причину.
        При анализе, проверке или ревью по умолчанию выводи основные выводы
        и рекомендации; обоснования, риски и ограничения добавляй только
        при их наличии и влиянии на решение. Учитывай запрошенную подробность.

  # ====== DeepSeek Cloud Models ======
  - name: DeepSeek-flash
    provider: deepseek
    model: deepseek-flash
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 4096
    requestOptions:
      extraBodyProperties:
        thinking:
          type: enabled # enabled | disabled
        reasoning_effort: high # low | high | max

  - name: Deepseek-v4-pro
    provider: deepseek
    model: deepseek-v4-pro
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
    roles:
      - chat
    requestOptions:
      extraBodyProperties:
        thinking:
          type: enabled # enabled | disabled
        reasoning_effort: high # low | high | max

  # ====== Yandex Cloud Models ======
  - name: YC-DeepSeek V4 Flash
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/deepseek-v4-flash/latest
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  - name: YC-Qwen3.6-35B
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/qwen3.6-35b-a3b
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  - name: YC-gpt-oss-20b
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/gpt-oss-20b/latest
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  - name: YC-Alice AI LLM Flash
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/aliceai-llm-flash/latest
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

