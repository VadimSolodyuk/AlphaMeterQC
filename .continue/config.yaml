name: Main Config
version: 1.0.0
schema: v1

models:
  # ====== Alibaba Cloud Models ======
  - name: "Qwen3.8 Flash | Development test"
    provider: openai
    model: qwen3.8-flash
    apiBase: ${{ secrets.ALI_API_BASE }}
    apiKey: ${{ secrets.ALI_API_KEY }}
    roles:
      - chat
    capabilities:
      - tool_use
    defaultCompletionOptions:
      maxTokens: 1024

  # ====== DeepSeek Cloud Models ======
  - name: DeepSeek-flash
    provider: deepseek
    model: deepseek-flash
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 4096
    requestOptions:
      extraBodyProperties:
        thinking:
          type: enabled # enabled | disabled
        reasoning_effort: high # low | high | max

  - name: Deepseek-v4-pro
    provider: deepseek
    model: deepseek-v4-pro
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
    roles:
      - chat
    requestOptions:
      extraBodyProperties:
        thinking:
          type: enabled # enabled | disabled
        reasoning_effort: high # low | high | max

  # ====== Yandex Cloud Models ======
  - name: YC-DeepSeek V4 Flash
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/deepseek-v4-flash/latest
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  - name: YC-Qwen3.6-35B
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/qwen3.6-35b-a3b
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  - name: YC-gpt-oss-20b
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/gpt-oss-20b/latest
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  - name: YC-Alice AI LLM Flash
    provider: openai
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
    model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/aliceai-llm-flash/latest
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  # - name: YC-Qwen3 235B
  #   model: gpt://${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}/qwen3-235b-a22b-fp8
  #   provider: openai
  #   apiBase: https://ai.api.cloud.yandex.net/v1
  #   apiKey: ${{ secrets.YANDEX_AISTUDIO_API_KEY }}
  #   requestOptions:
  #     headers:
  #       OpenAI-Project: ${{ secrets.YANDEX_AISTUDIO_FOLDER_ID }}

  # # ====== ANTHROPIC Cloud Models ======
  # - name: Claude Sonnet 4.6
  #   model: claude-sonnet-4-6
  #   provider: anthropic
  #   apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
  #   roles:
  #     - chat
  #     - edit
  #     - apply

  # ====== llama.cpp Local Models ======
  - name: Qwen2.5 Coder 7B llama.cpp
    provider: llama.cpp
    model: qwen2.5-coder-7b
    apiBase: http://127.0.0.1:8080
    roles:
      - chat
      - edit
      - apply
    contextLength: 8192
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 1024

  # ====== Ollama Local Models ======
  - name: Ollama-mistral:7b
    provider: ollama
    apiBase: http://localhost:11434
    model: mistral:7b

  - name: Ollama-qwen2.5:7b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5:7b

  - name: Ollama-qwen3.5:4b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen3.5:4b

  - name: Ollama-deepseek-coder:6.7b
    provider: ollama
    apiBase: http://localhost:11434
    model: deepseek-coder:6.7b

  - name: Ollama-qwen2.5-coder:7b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:7b

  - name: Ollama-qwen2.5-coder:3b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:3b

  - name: Ollama-qwen2.5-coder:1.5b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:1.5b

  - name: Ollama-nomic-embed
    provider: ollama
    apiBase: http://localhost:11434
    model: nomic-embed-text:latest
    roles:
      - embed
