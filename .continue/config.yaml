  # ====== llama.cpp Local Models ======
  - name: Qwen2.5 Coder 7B llama.cpp
    provider: llama.cpp
    model: qwen2.5-coder-7b
    apiBase: http://127.0.0.1:8080
    roles:
      - chat
      - edit
      - apply
    contextLength: 8192
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 1024

  # ====== Ollama Local Models ======
  - name: Ollama-mistral:7b
    provider: ollama
    apiBase: http://localhost:11434
    model: mistral:7b

  - name: Ollama-qwen2.5:7b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5:7b

  - name: Ollama-qwen3.5:4b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen3.5:4b

  - name: Ollama-deepseek-coder:6.7b
    provider: ollama
    apiBase: http://localhost:11434
    model: deepseek-coder:6.7b

  - name: Ollama-qwen2.5-coder:7b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:7b

  - name: Ollama-qwen2.5-coder:3b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:3b

  - name: Ollama-qwen2.5-coder:1.5b
    provider: ollama
    apiBase: http://localhost:11434
    model: qwen2.5-coder:1.5b

  - name: Ollama-nomic-embed
    provider: ollama
    apiBase: http://localhost:11434
    model: nomic-embed-text:latest
    roles:
      - embed
