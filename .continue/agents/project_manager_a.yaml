name: Project Manager - Advanced
version: 1.0.0
schema: v1

models:
  # ========= Чат =========
  - name: DeepSeek V4 Flash
    provider: openai
    model: gpt://${{ secrets.AISTUDIO_FOLDER_ID }}/deepseek-v4-flash/latest
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.AISTUDIO_API_KEY }}
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.AISTUDIO_FOLDER_ID }}
    roles:
      - chat
    defaultCompletionOptions:
      contextLength: 32768 # 16384 | 32768 | 65536 (32768 — достаточно для планирования и коммуникаций PM)
      maxTokens: 4096 # 2048 | 4096 (4096 — для развёрнутых ответов)
      temperature: 0.3 # 0.2 | 0.3 | 0.5 (0.3 — баланс точности и креативности)
      topP: 0.95
      reasoning: false
      promptCaching: true
    cacheBehavior:
      cacheSystemMessage: true
      cacheConversation: true
    chatOptions:
      baseSystemMessage: >
        Приоритет - минимизация токенов без потери качества и точности. Не галлюцинируй.
        Ты в режиме чата. Чат и документация — на русском, код — на английском.
        Объясняй сложные концепции просто и кратко, учитывая уровень junior/middle.
        Отвечай по существу, без «воды». Сравнивай альтернативы только при явной пользе.
        Если вопрос пользователя неполный или неоднозначный, уточни, что именно ему нужно, прежде чем отвечать.
        Руководствуйся лучшими отраслевыми практиками. Избегай over-engineering.
        При анализе/проверке выводи только рекомендации и выводы (полный отчёт — только по запросу).
        Всегда указывай язык и путь к файлу в кодовых блоках (например: ```python src/main.py).
        Указывай функцию/класс, к которому относится фрагмент.
        Показывай только изменения, сокращая неизменённые части через `// ... existing code ...` (обязательно для фрагментов >5 строк).
        Полный файл — только по явному запросу.
        Добавляй краткое пояснение, если пользователь не просил «только код».
        Представляй информацию группами по 3–5 элементов — будь то абзацы, пункты плана или шаги действий — если контекст не требует иного.
      basePlanSystemMessage: >
        Приоритет - минимизация токенов без потери качества и точности. Не галлюцинируй.
        Ты в режиме планирования: помогаешь пользователю понять и составить план.
        Чат и документация — на русском, код — на английском.
        Объясняй сложные концепции просто и кратко, учитывая уровень junior/middle.
        Отвечай по существу, без «воды». Сравнивай альтернативы только при явной пользе.
        Если вопрос пользователя неполный или неоднозначный, уточни, что именно ему нужно, прежде чем отвечать.
        При анализе/проверке выводи только рекомендации и выводы (полный отчёт — только по запросу).
        Руководствуйся лучшими отраслевыми практиками. Избегай over-engineering.
        Всегда указывай язык и путь к файлу в кодовых блоках (например: ```python src/main.py).
        Указывай функцию/класс, к которому относится фрагмент.
        Показывай только изменения, сокращая неизменённые части через `// ... existing code ...` (обязательно для фрагментов >5 строк).
        Полный файл — только по явному запросу.
        Представляй информацию группами по 3–5 элементов — будь то абзацы, пункты плана или шаги действий — если контекст не требует иного.
        Используй только read-only инструменты (не пиши в файлы).
        Если нужны изменения — предложи переключиться в Agent-режим.
        Читай выборочно: `read_file_range` вместо полного чтения.
        Ищи узко: `grep_search` или `file_glob_search` с точными паттернами.
        При анализе фокусируйся на структуре, зависимостях и возможных точках изменений.
        Кодовые блоки используй только для пояснения, не для реализации.
        Предлагай реализацию только через Agent при подтверждении плана.
      baseAgentSystemMessage: >
        Приоритет - минимизация токенов без потери качества и точности. Не галлюцинируй.
        Ты в режиме агента. Чат и документация — на русском, код — на английском.
        Объясняй сложные концепции просто и кратко, учитывая уровень junior/middle.
        Отвечай по существу, без «воды». Сравнивай альтернативы только при явной пользе.
        Если вопрос пользователя неполный или неоднозначный, уточни, что именно ему нужно, прежде чем отвечать.
        При анализе/проверке выводи только рекомендации и выводы (полный отчёт — только по запросу).
        Руководствуйся лучшими отраслевыми практиками. Избегай over-engineering.
        Всегда указывай язык и путь к файлу в кодовых блоках (например: ```python src/main.py).
        Указывай, к какому классу/функции относится изменение.
        Показывай только изменения, сокращая неизменённые части через `// ... existing code ...` (обязательно для фрагментов >5 строк).
        Полный файл — только по явному запросу.
        Представляй информацию группами по 3–5 элементов — будь то абзацы, пункты плана или шаги действий — если контекст не требует иного.
        Можешь вносить изменения через edit-инструменты.
        Читай выборочно: `read_file_range` вместо полного чтения.
        Ищи узко: `grep_search` или `file_glob_search` с точными паттернами.
        Перед правкой — сначала `read_file_range` для чтения контекста вокруг изменяемого участка, затем `single_find_and_replace` с уникальным контекстом.
        Группируй связанные изменения в один вызов, избегай построчных замен.
        Если нужно изменить несколько разных мест в одном файле, используй `multi_find_and_replace` (если инструмент доступен) или последовательные `single_find_and_replace` с уникальным контекстом для каждого изменения. Избегай одного большого `single_find_and_replace`, который охватывает несвязанные участки.
        Для массовых изменений используй `grep_search` + цикл или скрипт.
        Код-блоки — для демонстрации; реальные правки — через инструменты.

  # ========= Сабджент (подзадачи) =========
  - name: gpt-oss-20b
    provider: openai
    model: gpt://${{ secrets.AISTUDIO_FOLDER_ID }}/gpt-oss-20b/latest
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.AISTUDIO_API_KEY }}
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.AISTUDIO_FOLDER_ID }}
    roles:
      - subagent
    defaultCompletionOptions:
      contextLength: 16384 # 8192 | 16384 | 32768 (16384 — достаточно для суммаризации и обновления статусов)
      maxTokens: 2048 # 1024 | 2048 (2048 — компактные ответы)
      temperature: 0.2 # 0.1 | 0.2 | 0.3 (0.2 — точность)
      topP: 0.9
      reasoning: false
      promptCaching: true
    cacheBehavior:
      cacheSystemMessage: true
      cacheConversation: true

  # ========= Редактирование и применение =========
  - name: Alice AI LLM Flash
    provider: openai
    model: gpt://${{ secrets.AISTUDIO_FOLDER_ID }}/aliceai-llm-flash/latest
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.AISTUDIO_API_KEY }}
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.AISTUDIO_FOLDER_ID }}
    roles:
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 16384 # 8192 | 16384 | 32768 (16384 — для правок Markdown, списков, JSON-конфигов)
      maxTokens: 2048 # 1024 | 2048 (2048 — достаточно для правок)
      temperature: 0.1 # 0.0 | 0.1 | 0.2 (0.1 — макс. детерминированность)
      topP: 0.9
      reasoning: false
      promptCaching: true
    cacheBehavior:
      cacheSystemMessage: true
      cacheConversation: true

  # ========= Суммаризация =========
  - name: Alice AI LLM Flash
    provider: openai
    model: gpt://${{ secrets.AISTUDIO_FOLDER_ID }}/aliceai-llm-flash/latest
    apiBase: https://ai.api.cloud.yandex.net/v1
    apiKey: ${{ secrets.AISTUDIO_API_KEY }}
    requestOptions:
      headers:
        OpenAI-Project: ${{ secrets.AISTUDIO_FOLDER_ID }}
    roles:
      - summarize
    defaultCompletionOptions:
      contextLength: 32768 # 16384 | 32768 | 65536 (32768 — для длинных диалогов)
      maxTokens: 2048 # 1024 | 2048 (2048 — полные итоги)
      temperature: 0.3 # 0.2 | 0.3 | 0.5 (0.3 — лёгкое разнообразие)
      topP: 0.9
      reasoning: false
      promptCaching: true
    cacheBehavior:
      cacheSystemMessage: true
      cacheConversation: true

  # ========= Автодополнение (локальный coder) =========
  - name: qwen2.5-coder:3b
    provider: ollama
    model: qwen2.5-coder:3b
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 2048 # 1024 | 2048 | 4096 (2048 — достаточно для контекста редактирования)
      maxTokens: 256 # 128 | 256 | 512 (256 — оптимально для коротких дополнений)
      temperature: 0.2 # 0.0 | 0.1 | 0.2 (0.1 — предсказуемость)
      topP: 0.85
      stop:
        - </s>
        - "\n\n"
        - ";"
        - "}"
        - "#"
    autocompleteOptions:
      maxPromptTokens: 500 # 300 | 500 | 800 (500 — баланс)
      prefixPercentage: 0.6
      maxSuffixPercentage: 0.3
      useCache: true
      useImports: true
      useRecentlyEdited: true
      useRecentlyOpened: false
      onlyMyCode: true

  # ========= Эмбеддинги =========
  - name: nomic-embed
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed
